name: CTS quality gate
on:
  push:
  pull_request:
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Contract and regression tests (no model download)
        run: python -m unittest discover -s tests -v
      - name: Syntax checks
        run: python -m compileall -q benchmark300.py install_models.py tests cts_ui.py
